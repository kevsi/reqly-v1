[package]
name = "reqly"
version = "0.1.0"
description = "Reqly Desktop App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "reqly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[features]
default = []
ts-export = ["ts-rs"]

[dependencies]
tokio = { version = "1", features = ["time", "rt", "macros", "sync", "net"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
ts-rs = { version = "10", features = ["serde-compat"], optional = true }
log = "0.4"
reqwest = { version = "0.11", features = ["rustls-tls", "gzip", "brotli", "deflate", "cookies", "json"] }
tauri = { version = "2.11.1", features = [] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
http = "1"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-notification = "2"
open = "5.3"
base64 = "0.22"
tiny_http = "0.12"
hyper = { version = "1", features = ["http2", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
git2 = { version = "0.19", features = ["vendored-libgit2"] }
tauri-plugin-oauth = "2"
dotenvy = "0.15"

[dev-dependencies]
tauri = { version = "2.11.1", features = ["test"] }
tempfile = "3"
