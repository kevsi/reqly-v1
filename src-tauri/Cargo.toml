[package]
name = "reqly"
version = "0.1.0"
description = "Reqly Desktop App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "reqly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[features]
default = []
ts-export = ["ts-rs"]

[dependencies]
tokio = { version = "1", features = ["time", "rt", "macros", "sync", "net", "io-util"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
ts-rs = { version = "10", features = ["serde-compat"], optional = true }
log = "0.4"
reqwest = { version = "0.12", features = ["rustls-tls", "gzip", "brotli", "deflate", "cookies", "json", "blocking", "stream"] }
tauri = { version = "2.11.1", features = [] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
keyring = "3"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
http = "1"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-notification = "2"
open = "5.3"
base64 = "0.22"
tiny_http = "0.12"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rcgen = "0.13"
httparse = "1"
hyper = { version = "1", features = ["http2", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
git2 = { version = "0.19", features = ["vendored-libgit2"] }
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64 = "0.22"
