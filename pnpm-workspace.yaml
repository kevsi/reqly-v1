packages:
  - "reqy-web"
  - "reqly-landing"
  - "reqly-docs"
  - "recli"
  - "packages/*"
  - "sync-server"
  - "mcp-docs"
# Supply-chain hardening (pnpm >= 10.16) :
# - minimumReleaseAge : refuse les paquets publiés il y a moins de 7 jours
#   (nouveaux paquets potentiellement malveillants ou instables).
# - trustPolicy: no-downgrade : empêche une mise à jour de rétrograder les
#   réglages de sécurité.
# - blockExoticSubdeps : interdit l'installation de dépendances transitives
#   depuis des sources non fiables.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
# Faux positifs connus de trustPolicy no-downgrade (packages 2023-2024 sans
# attestation car les attestations npm n'existaient pas encore ; aucune version
# attestée n'existe sur ces majors) :
# - semver 6.3.1 : standard 2023, dépendance transitive d'eslint-plugin-react,
#   aucune version 6.x attestée n'existe (vérifié) — bump 7.x = breaking API.
trustPolicyExclude:
  - semver@6.3.1
overrides:
  # fast-uri <3.1.5: host-confusion via backslash authority (GHSA-4cwx-7wf7-3272).
  fast-uri: ^3.1.5
  # hono <4.12.34: ReDoS in CORS middleware (GHSA-v3r7-h72x-cjcm).
  hono: ^4.12.34
  # ip-address <=10.3.0: leading-zero octal parsing -> SSRF bypass (GHSA-2p57-rm9w-gvfp).
  ip-address: ^10.4.0
  lodash: ^4.17.24
  lodash-es: ^4.17.24
  postcss: ^8.5.18
  sharp: ^0.35.0
  # js-yaml <4.3.1: quadratic CPU on !!omap resolution (CVE-2026-59870) - needs >=4.3.1.
  js-yaml: ^4.3.1
  "@hono/node-server": ^2.0.5
  # brace-expansion: ReDoS via crafted glob string (GHSA-3jxr, GHSA-mh99, GHSA-rgw5 etc.)
  # v1 path via minimatch@3 (eslint, test-exclude); v2 path via direct dependents.
  "brace-expansion@^1": "1.1.18"
  "brace-expansion@^2": "2.1.4"
  # brace-expansion v3/v4/v5 via minimatch@10 (vitest-coverage, eslint): DoS
  # exponential/OOM (GHSA-3jxr etc.), patched >=5.0.9.
  "brace-expansion@^5": "5.0.9"
  # undici: multiple high/moderate advisories — force patched version.
  # Keep <8: undici 8 removed lib/handler/wrap-handler.js, breaking jsdom@29.
  undici: ">=7.29.0 <8"
  # undici-types <8 (pulled by @types/node 22.x): flagged "high-risk trust
  # downgrade" by trustPolicy no-downgrade, breaking `pnpm install
  # --frozen-lockfile` on the server. Types-only package, no runtime impact.
  undici-types: "^8.3.0"
  # eslint-import-resolver-typescript 3.10.1: trust downgrade (3.10.0 had
  # provenance, 3.10.1 does not). Dev-only transitive of eslint-plugin-import.
  "eslint-import-resolver-typescript@3.10.1": "3.10.0"
  # nanoid <3.3.17: infinite loop via sequential size arguments (CWE-835) - pulled in by postcss.
  nanoid: "^3.3.17"
allowBuilds:
  better-sqlite3: true
  esbuild: false
  sharp: true
  tree-sitter-c-sharp: true
  tree-sitter-go: true
  tree-sitter-java: true
  tree-sitter-javascript: true
  tree-sitter-php: true
  tree-sitter-python: true
  tree-sitter-ruby: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
  unrs-resolver: true
networkConcurrency: 4
