app = "reqly-sync"
primary_region = "cdg"

[env]
  PORT = "4000"
  REQLY_DB_PATH = "/data/reqly-sync.db"
  NODE_ENV = "production"
  # Fly overwrites X-Forwarded-For from the socket, so it is not spoofable
  # here — without this, every request shares one socket IP and the auth
  # rate limiter (20/min) becomes a sitewide lockout.
  TRUSTED_PROXY = "true"
  EMAIL_PROVIDER = "smtp"
  EMAIL_FROM = "Reqly <roughikev@gmail.com>"
  SMTP_HOST = "smtp.gmail.com"
  SMTP_PORT = "587"
  SMTP_SECURE = "false"
  SMTP_USER = "roughikev@gmail.com"
  # CORS/WS: allow the deployed app (reqly-web on Fly) + landing + local dev.
  ALLOWED_ORIGIN = "https://reqly-web.fly.dev,https://reqly.dev,http://localhost:3000,http://localhost:4173,tauri://localhost,https://tauri.localhost"
  # Secrets are NOT committed here. Set before first deploy:
  #   fly secrets set --app reqly-sync AUTH_SIGNING_SECRET="$(openssl rand -hex 32)"
  #   fly secrets set --app reqly-sync SMTP_PASS="..."

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  # This server is single-instance by design: the rate limiter is in-memory
  # and SQLite WAL is mounted on a single volume. Never scale above 1.
  max_machines_running = 1

  [http_service.check]
    port = 4000
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[mounts]]
  source = "reqly_data"
  destination = "/data"
