app = "reqly-sync"
primary_region = "cdg"

[env]
  PORT = "4000"
  REQLY_DB_PATH = "/data/reqly-sync.db"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "reqly_data"
  destination = "/data"
