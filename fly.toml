app = "reqly-web"
primary_region = "cdg"

[build]
  dockerfile = "reqy-web/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  NEXT_PUBLIC_SYNC_URL = "https://reqly-sync.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1