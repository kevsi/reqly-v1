name: "Recli API Test Runner"
description: "Run Recli API test collections in CI"
author: "recli"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  collection:
    description: "Path to the collection JSON file"
    required: true
  env:
    description: "Environment name to use"
    required: false
  timeout:
    description: "Request timeout in milliseconds"
    required: false
    default: "30000"
  reporter:
    description: "Report format: cli, junit, html"
    required: false
    default: "junit"
  output:
    description: "Path for the report file"
    required: false
    default: "recli-report.xml"
  parallel:
    description: "Run requests in parallel"
    required: false
    default: "false"
  iterations:
    description: "Number of iterations"
    required: false
    default: "1"
  data:
    description: "Data file for iterations (CSV or JSON)"
    required: false

runs:
  using: "composite"
  steps:
    # Actions épinglées par SHA (anti supply-chain) :
    #   setup-node v4      -> 49933ea5288caeca8642d1e84afbd3f7d6820020
    #   upload-artifact v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: "20"

    - name: Install recli
      shell: bash
      run: npm install -g recli

    - name: Validate collection
      shell: bash
      env:
        RECLI_COLLECTION: ${{ inputs.collection }}
      run: recli validate "$RECLI_COLLECTION"

    - name: Run collection
      shell: bash
      env:
        # Les inputs GitHub Actions sont des données non fiables : on les
        # passe par des variables d'environnement citées ("$VAR") au lieu de
        # les interpoler dans le script shell (anti-injection de commandes).
        RECLI_COLLECTION: ${{ inputs.collection }}
        RECLI_ENV: ${{ inputs.env }}
        RECLI_TIMEOUT: ${{ inputs.timeout }}
        RECLI_REPORTER: ${{ inputs.reporter }}
        RECLI_OUTPUT: ${{ inputs.output }}
        RECLI_PARALLEL: ${{ inputs.parallel }}
        RECLI_ITERATIONS: ${{ inputs.iterations }}
        RECLI_DATA: ${{ inputs.data }}
      run: |
        RECLI_ARGS=""
        if [ -n "$RECLI_ENV" ]; then RECLI_ARGS="$RECLI_ARGS --env $RECLI_ENV"; fi
        if [ -n "$RECLI_TIMEOUT" ]; then RECLI_ARGS="$RECLI_ARGS --timeout $RECLI_TIMEOUT"; fi
        if [ -n "$RECLI_REPORTER" ]; then RECLI_ARGS="$RECLI_ARGS --reporter $RECLI_REPORTER"; fi
        if [ -n "$RECLI_OUTPUT" ]; then RECLI_ARGS="$RECLI_ARGS --output $RECLI_OUTPUT"; fi
        if [ "$RECLI_PARALLEL" = "true" ]; then RECLI_ARGS="$RECLI_ARGS --parallel"; fi
        if [ -n "$RECLI_ITERATIONS" ]; then RECLI_ARGS="$RECLI_ARGS --iterations $RECLI_ITERATIONS"; fi
        if [ -n "$RECLI_DATA" ]; then RECLI_ARGS="$RECLI_ARGS --data $RECLI_DATA"; fi
        recli run "$RECLI_COLLECTION" $RECLI_ARGS

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: recli-report
        path: ${{ inputs.output }}
