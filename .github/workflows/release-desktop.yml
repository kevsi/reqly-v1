name: Release desktop

# Build Tauri (Windows NSIS, macOS dmg, Linux AppImage/deb) sur tag v*,
# puis publication en release GitHub avec les installateurs en pièces
# jointes. Le CTA de la landing pointe sur cette page de releases.
#
# Déclencheurs :
# - push d'un tag v* (release officielle)
# - workflow_dispatch (dry-run : build sans créer de release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version tirée de package.json#packageManager (pnpm@11.10.0).

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Dépendances système Linux pour Tauri (webkit2gtk etc.)
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libappindicator3-dev ET libayatana-appindicator3-dev se chevauchent
          # (paquets cassés « held ») — un seul des deux suffit pour Tauri.
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      # macOS x86_64 est cross-compilé depuis un runner arm64 (macos-latest).
      # openssl-sys (tiré par git2 → libgit2-sys/libssh2-sys) réclame alors un
      # OpenSSL x86_64 introuvable sur l'image (brew natif = arm64) : on
      # installe Homebrew Intel sous Rosetta + openssl@3 x86_64, et on pointe
      # OPENSSL_DIR dessus pour tout le job.
      - name: Install x86_64 OpenSSL (macOS cross-compile)
        if: matrix.os == 'macos-latest' && matrix.target == 'x86_64-apple-darwin'
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          if [ ! -x /usr/local/bin/brew ]; then
            NONINTERACTIVE=1 arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          arch -x86_64 /usr/local/bin/brew install openssl@3
          echo "OPENSSL_DIR=/usr/local/opt/openssl@3" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Reqly ${{ github.ref_name }}"
          releaseBody: "Voir les notes de version dans le changelog du dépôt."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
