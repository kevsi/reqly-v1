name: Deploy sync-server

# Déploiement du sync-server EC2 (cf. sync-server/FONCTIONNEMENT.md §14).
# - auto : à chaque push sur main qui touche sync-server/ ou ce workflow
# - manuel : onglet Actions → "Deploy sync-server" → Run workflow
#
# SSM : le runner envoie les commandes via AWS Systems Manager (sortant 443)
# — aucun port entrant requis. Secrets requis : AWS_DEPLOY_ROLE_ARN (OIDC
# GitHub → rôle reqly-gh-deploy, eu-north-1) et EC2_INSTANCE_ID.

on:
  push:
    branches: [main]
    paths:
      - "sync-server/**"
      - ".github/workflows/deploy-sync-server.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: reqly-deploy
          role-duration-seconds: 900

      - name: Deploy via SSM (git pull + rebuild + restart + health)
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          # Le script est passé en base64 dans un fichier JSON (--parameters
          # file://) : le JSON gère tout l'échappement, aucun souci de quotes.
          run_ssm() {
            local doc_b64="$1"
            printf '{"commands":["echo %s | base64 -d | bash"]}' "'$doc_b64'" > params.json
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "reqly deploy" \
              --parameters file://params.json \
              --query "Command.CommandId" --output text
          }

          wait_ssm() {
            local cid="$1"
            for i in $(seq 1 60); do
              sleep 5
              # get-command-invocation: statut d'une commande précise sur
              # l'instance — permissions simples (ssm:GetCommandInvocation).
              local line
              line=$(aws ssm get-command-invocation \
                --command-id "$cid" \
                --instance-id "$INSTANCE_ID" \
                --query "[Status, StandardOutputContent]" --output text 2>/dev/null || true)
              # --output text sépare les champs par tabulation.
              local st out
              st="${line%%	*}"
              out="${line#*	}"
              case "$st" in
                Success) echo "$out"; return 0 ;;
                Failed|Cancelled|TimedOut) echo "$out" >&2; return 1 ;;
              esac
            done
            echo "SSM command timed out after 5 min (last status: $st)" >&2
            return 1
          }

          DEPLOY_SCRIPT='set -e
            export PATH=/home/ubuntu/.nvm/versions/node/v24.18.1/bin:$PATH
            cd /home/ubuntu/reqly-v1
            git pull --ff-only
            git log -1 --oneline
            bash /home/ubuntu/rebuild-restart.sh'

          echo "--- deploy ---"
          CID=$(run_ssm "$(printf '%s' "$DEPLOY_SCRIPT" | base64 -w0)")
          wait_ssm "$CID" | tail -40 || exit 1

          echo "--- health check ---"
          HEALTH_SCRIPT='curl -sS --max-time 10 http://localhost:4000/health; echo; systemctl is-active reqly-sync'
          CID=$(run_ssm "$(printf '%s' "$HEALTH_SCRIPT" | base64 -w0)")
          wait_ssm "$CID" || exit 1
