name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.10.0
  NODE_VERSION: "22"
  # Temporary migration guard: execute JavaScript actions with Node 24 now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Secret scan
        run: |
          FILES=$(git ls-files reqy-web/app reqy-web/lib sync-server/src recli/src packages/shared/src | tr '\n' ' ')
          node scripts/check-secrets.mjs $FILES
      - name: Run tests
        run: pnpm test

  e2e:
    name: E2E Web (Playwright)
    needs: [typecheck, lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @reqly/shared build
      - name: Generate CI secrets
        working-directory: reqy-web
        run: node scripts/generate-dev-secrets.mjs
      - name: Install Playwright Chromium
        run: pnpm --dir reqy-web exec playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: pnpm --dir reqy-web test:e2e
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-e2e-report
          path: |
            reqy-web/playwright-report/
            reqy-web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-web:
    name: Build Web (SSR)
    needs: [typecheck, lint, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @reqly/shared build
      - name: Build web (with bundle analyzer)
        run: pnpm --dir reqy-web build
        env:
          AUTH_SIGNING_SECRET: ${{ secrets.AUTH_SIGNING_SECRET || 'ci-build-placeholder-000000000000' }}
          # NEXT_PUBLIC_SYNC_URL is a public URL baked into the client bundle —
          # store as a GitHub Actions variable (Settings > Variables), not a secret.
          NEXT_PUBLIC_SYNC_URL: ${{ vars.NEXT_PUBLIC_SYNC_URL }}
          # Single build: the analyzer emits .next/analyze/client.html on the
          # same production build, so the size gate needs no second build.
          ANALYZE: "true"
      - name: Bundle size gate (fail if main-app shell > 500 KB gzipped)
        run: node reqy-web/scripts/bundle-gate.mjs
      - name: Upload web artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-build
          path: |
            reqy-web/.next/
            reqy-web/public/
            reqy-web/next.config.mjs
            reqy-web/package.json
          retention-days: 1

  tauri-check:
    name: Check Tauri (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Check compilation
        working-directory: src-tauri
        run: cargo check --locked
      - name: Run Rust smoke tests
        working-directory: src-tauri
        run: cargo test --locked

  build-desktop:
    name: Build Desktop (Tauri)
    needs: [typecheck, lint, test, e2e, tauri-check]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @reqly/shared build
      - name: Build desktop application
        run: pnpm tauri:build
        env:
          AUTH_SIGNING_SECRET: ${{ secrets.AUTH_SIGNING_SECRET || 'ci-build-placeholder-000000000000' }}
          NEXT_PUBLIC_SYNC_URL: ${{ vars.NEXT_PUBLIC_SYNC_URL }}
          TAURI_DEV_HOST: "localhost"
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-build-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
            reqy-web/out/
          retention-days: 1

  build-docker:
    name: Build Docker Image
    needs: [typecheck, lint, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Docker image
        # AUTH_SIGNING_SECRET is a runtime secret — never pass as a build-arg
        # (visible via `docker history`). Inject at container start instead:
        #   docker run -e AUTH_SIGNING_SECRET=... reqy-web:ci
        # NEXT_PUBLIC_SYNC_URL IS needed at build-time (Next.js inlines it into
        # the client bundle) but it is a public URL — store as a GitHub variable.
        run: |
          docker build -t reqy-web:ci \
            --build-arg NEXT_PUBLIC_SYNC_URL=${{ vars.NEXT_PUBLIC_SYNC_URL }} \
            -f reqy-web/Dockerfile .
      - name: Test Docker container starts
        run: |
          docker run -d -p 3000:3000 \
            -e AUTH_SIGNING_SECRET=ci-runtime-placeholder-000000000000 \
            --name reqy-web-test reqy-web:ci
          trap 'docker logs reqy-web-test 2>&1 || true; docker stop reqy-web-test 2>/dev/null || true; docker rm -f reqy-web-test 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:3000; then
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become ready within 30 seconds"
          exit 1

  analyser-api-tests:
    name: Analyser API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      # analyser-api is a standalone workspace with its own pnpm-lock.yaml.
      - name: Install dependencies
        working-directory: analyser-api
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: analyser-api
        run: pnpm test
