name: recli CI

on:
  push:
    paths:
      - "recli/**"
      - "packages/shared/**"
  pull_request:
    paths:
      - "recli/**"
      - "packages/shared/**"

permissions:
  contents: read

jobs:
  test:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan (recli + shared)
        run: |
          FILES=$(git ls-files recli packages/shared | tr '\n' ' ')
          node scripts/check-secrets.mjs $FILES

      - name: Build @reqly/shared (recli depends on its dist)
        run: pnpm --dir packages/shared build

      - name: Typecheck recli
        run: pnpm --dir recli exec tsc --noEmit

      - name: Test recli (260 unit + integration tests)
        run: pnpm --dir recli test

      - name: Build recli
        run: pnpm --dir recli build
