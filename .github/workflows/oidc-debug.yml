name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get OIDC token claims
        run: |
          # Récupère le token OIDC et décode les claims (sub, aud) — sans les envoyer ailleurs
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          JWT=$(echo "$TOKEN" | jq -r .value)
          PAYLOAD=$(echo "$JWT" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)
          echo "=== Claims du token GitHub (sub/aud) ==="
          echo "$PAYLOAD" | jq '{sub, aud, iss}'

      - name: Raw STS call (erreur complète d AWS)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          JWT=$(echo "$TOKEN" | jq -r .value)
          echo "=== Appel AssumeRoleWithWebIdentity brut ==="
          # --debug rend le message d'erreur STS complet (condition en échec)
          aws sts assume-role-with-web-identity \
            --role-arn "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" \
            --role-session-name debugsession \
            --web-identity-token "$JWT" \
            --debug 2>&1 | grep -iE "error|denied|condition|not match|sub|aud|assume" | tail -30
